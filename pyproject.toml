[project]
name = "stdapi"
version = "1.15.0"
description = "Standard API for AI on AWS"
authors = [{ name = "J.Goutin", email = "contact@stdapi.ai" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "aiobotocore>=3",
    "botocore>=1.43.30",
    # Bidirectional (HTTP/2 request event stream) operations: botocore implements
    # response event streams only. Pinned: pre-1.0, and they move together.
    "aws-sdk-bedrock-runtime>=0.8,<0.9",
    "aws-sdk-polly>=0.8,<0.9",
    "aws-sdk-transcribe-streaming>=0.8,<0.9",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sse-starlette",
    "langcodes",
    "python-multipart",
    "aiohttp",
    "aiodns",
    "python-magic",
    "pybase64",
    "pillow",
    # RS256 verification of user pool access tokens, independent of the mcp extra.
    "pyjwt[crypto]>=2.10.1",
]

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-botocore",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-propagator-aws-xray",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-http",
]
uvicorn = ["uvicorn[standard]"]
granian = ["granian[uvloop]"]
# fastapi-mcp 0.4.0 declares "mcp>=1.12.0" with no ceiling, but mcp 2.0 changed
# Server.__init__ and fastapi_mcp fails on it. Cap until fastapi-mcp supports 2.x.
mcp     = ["fastapi-mcp", "mcp<2"]

[dependency-groups]
test = [
    "stdapi[opentelemetry, uvicorn]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-rerunfailures",
    "pytest-xdist[psutil]",
    "httpx",
    "openai",
    "anthropic[bedrock]",
    "cohere>=7.0.5",
]
lint = [
    "stdapi[opentelemetry, uvicorn]",
    "mypy",
    "ruff",
    "types-aiobotocore[bedrock, bedrock-agent-runtime, bedrock-runtime, polly, comprehend, meteringmarketplace, pricing, s3, sts, transcribe, translate]>=3.8",
    "types-PyYAML",
]
docs = [
    "stdapi",
    "mkdocs-material",
    "mkdocs-redoc-tag",
]
dev = [
    "stdapi[opentelemetry, uvicorn, granian, mcp]",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]

[tool.uv]
# aiobotocore 3.7.0 pins "botocore>=1.42.90,<1.43.1", lagging the bedrock-runtime
# API (InvokeGuardrailChecks added in botocore 1.43.30). aiobotocore only wraps
# HTTP transport/credentials/loaders, not the generated service clients, so
# newer botocore releases work in practice despite the declared ceiling.
override-dependencies = [
    "botocore>=1.43.30,<1.44",
    # Declared by fastapi-mcp but never imported by any shipped code path.
    "rich; sys_platform == 'never'",
    "typer; sys_platform == 'never'",
    "tomli; sys_platform == 'never'",
]

[tool.hatch.build.targets.sdist]
include = ["stdapi"]

[tool.hatch.build.targets.wheel]
include = ["stdapi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
fix = true
output-format = "grouped"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501", # format conflicts, line length
    "PLR2004", # constants ints
    "PLR0913", # Functions with many arguments
    "PLR0917", # Functions with many positional arguments
    "PLW2901", # loop variable overide
    "COM812", # format conflicts
    "TD002", # to do comments
    "TD003", # to do comments
    "FIX002", # to do comments
    "ERA001", # docstring false positive
    "PYI036", # type false positive
    "CPY001", # Copyright notice
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
split-on-trailing-comma=false

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.flake8-type-checking]
# Pydantic model field annotations are evaluated at class-definition time.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "stdapi.types.BaseModelRequest",
    "stdapi.types.BaseModelRequestWithExtra",
    "stdapi.types.BaseModelRequestWithFormExtra",
    "stdapi.types.BaseModelResponse",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.BackgroundTasks"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # assert
    "ARG002", # parametrize comments
    "FBT001", # bool fixture
    "C901", # max complexity
]

[tool.mypy]
files = ["stdapi", "tests"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
implicit_reexport = false
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

# The generated bidirectional AWS clients ship no py.typed marker; everything
# they are built on (smithy_*, awscrt) is typed.
[[tool.mypy.overrides]]
module = [
    "aws_sdk_polly.*",
    "aws_sdk_bedrock_runtime.*",
    "aws_sdk_transcribe_streaming.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--dist=loadgroup",
]
markers = [
    "expensive: compute/cost expensive tests, skipped unless --expensive is passed",
    "agentic: agentic tests, skipped unless --agentic is passed",
    "slow: cheap but slow tests, skipped unless --slow is passed",
    "video: video generation tests, by far the costliest, skipped unless --video is passed",
    "container: builds the container images and tests them, skipped unless --container is passed",
    "drift: compares a hardcoded vendor fact against its published source, skipped unless --drift is passed",
    "image: strategic test re-run against the built container image by the container suite",
    "local: tests the local implementation in-process, skipped with --server-url or --use-official-api",
    "gateway(reason): needs a stdapi.ai gateway for a capability the upstream vendors do not expose, skipped with --use-official-api",
    "retry(reason, reruns=, delay=): re-run a test that a stated non-deterministic condition -- never a defect -- can fail; the reason is mandatory",
    "xdist_group: group tests to run on the same xdist worker",
]
filterwarnings = [
    # pytestmark asyncio(loop_scope=...) on non-async tests is harmless
    "ignore:The test.*is marked with.*asyncio.*but it is not an async function:pytest.PytestWarning",
    # aiobotocore module-scoped fixture teardown on a different event loop leaves
    # the aiohttp connector's _wait_for_close coroutine unawaited — harmless in tests
    "ignore:coroutine '_wait_for_close' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
branch = true
source = ["stdapi"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if _TYPE_CHECKING:",
]
