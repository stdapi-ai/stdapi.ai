---
site_name: stdapi.ai
site_description: "Deploy OpenAI, Anthropic, and Cohere-compatible applications on Amazon Bedrock with no code changes. Access 100+ models including Claude, OpenAI GPT, xAI Grok, Amazon Nova for chat, video generation, and content moderation, with enterprise compliance, pay-per-use pricing, and AWS data sovereignty."
site_url: https://stdapi.ai
site_author: JGoutin-dev
exclude_docs: |
  internal/**/*

theme:
  name: material
  language: en
  logo: styles/logo.svg
  favicon: styles/logo.svg
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.prune
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - toc.follow
  font:
    text: Open Sans
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
nav:
  - Home: index.md
  - Features: features.md
  - Get Started:
      - Overview: getting_started.md
      - Deploy on AWS: operations_getting_started.md
      - Run Locally with Docker: operations_getting_started_local.md
      - Troubleshooting: operations_troubleshooting.md
  - Documentation:
      - API:
          - Overview: api_overview.md
          - API Reference: api_reference.md
          - OpenAI Compatible:
            - Responses: api_openai_responses.md
            - Conversations: api_openai_conversations.md
            - Chat Completions: api_openai_chat_completions.md
            - Completions: api_openai_completions.md
            - Files: api_openai_files.md
            - Vector Stores: api_openai_vector_stores.md
            - Batches: api_openai_batches.md
            - Images Generations: api_openai_images_generations.md
            - Images Edits: api_openai_images_edits.md
            - Images Variations: api_openai_images_variations.md
            - Videos: api_openai_videos.md
            - Audio Speech: api_openai_audio_speech.md
            - Audio Transcriptions: api_openai_audio_transcriptions.md
            - Audio Translations: api_openai_audio_translations.md
            - Realtime: api_openai_realtime.md
            - Embeddings: api_openai_embeddings.md
            - Moderations: api_openai_moderations.md
            - Models: api_openai_models.md
          - Anthropic Compatible:
            - Messages: api_anthropic_messages.md
            - Message Batches: api_anthropic_batches.md
            - Files: api_anthropic_files.md
            - Models: api_anthropic_models.md
          - Cohere Compatible:
            - Rerank: api_cohere_rerank.md
            - Embed: api_cohere_embed.md
          - Native Extensions:
            - Search Models: api_search_models.md
            - Model Pricing: api_model_pricing.md
      - Operations:
          - Deploy on AWS: operations_getting_started.md
          - Run Locally with Docker: operations_getting_started_local.md
          - Advanced Deployment: operations_deploy_advanced.md
          - Configuration: operations_configuration.md
          - Authentication & Security: operations_authentication_security.md
          - IAM Permissions: operations_iam_permissions.md
          - Licensing: operations_licensing.md
          - Logging & Monitoring: operations_logging_monitoring.md
          - Cost Management: operations_cost_management.md
          - Resilience & Failover: operations_resilience.md
          - Data Sovereignty & Compliance: operations_compliance.md
          - Troubleshooting: operations_troubleshooting.md
      - Use Cases:
          - Overview: use_cases.md
          - Open WebUI Integration: use_cases_openwebui.md
          - LobeHub Integration: use_cases_lobehub.md
          - n8n Integration: use_cases_n8n.md
          - AI Coding Assistants: use_cases_coding_assistants.md
          - Python Client Libraries: use_cases_python_libraries.md
          - Autonomous Agent CLIs: use_cases_autonomous_agents.md
          - RAG Pipelines: use_cases_rag.md
          - RAGFlow Integration: use_cases_ragflow.md
          - Home Assistant Voice: use_cases_home_assistant.md
      - Releases & Roadmap: roadmap.md
  - Contact: contact.md

repo_url: https://github.com/stdapi-ai/stdapi.ai
repo_name: stdapi-ai/stdapi.ai
edit_uri: ''

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # Self-hosts the Google Fonts stylesheet and font files at build time: removes
  # two render-blocking third-party origins and keeps visitor data off Google.
  # Mermaid is self-hosted too. The plugin rewrites its URL in the theme bundle
  # to an absolute site_url path, so diagrams render on the canonical domain but
  # not in a local preview served from another origin.
  - privacy
  - redoc-tag
  - meta

hooks:
  - docs_hooks/fastapi_openapi.py
  - docs_hooks/markdown_for_agents.py

extra_css:
  - styles/theme.css

extra_javascript:
  - js/home-carousel.js

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stdapi-ai/stdapi.ai
      name: GitHub repository
    - icon: fontawesome/brands/aws
      link: https://aws.amazon.com/marketplace/pp/prodview-su2dajk5zawpo
      name: AWS Marketplace
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!
  homepage_buttons:
    - label: Get started
      link: getting_started.md
    - label: API overview
      link: api_overview.md
    - label: Troubleshooting
      link: operations_troubleshooting.md
    - label: View on GitHub
      link: https://github.com/stdapi-ai/stdapi.ai
    - label: AWS Marketplace
      link: https://aws.amazon.com/marketplace/pp/prodview-su2dajk5zawpo

copyright: <a href="https://jgoutin.dev/">JGoutin-dev SARL - 994495422 R.C.S. Paris, France</a>
