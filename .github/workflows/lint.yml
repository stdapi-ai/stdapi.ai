---
name: Lint

on:
  push:
  pull_request:
    branches: ["**"]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Python linting
        run: ruff check .

      - name: Python format checking
        run: ruff format --check .

      - name: Python type checking
        run: mypy .

  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'stdapi-ai/stdapi.ai' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    needs: [static-analysis]
    environment: github-releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          SERVER_VERSION=$(grep -oP 'SERVER_VERSION = "\K[^"]+' stdapi/server.py)
          if [ "$TAG_VERSION" != "v$SERVER_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match SERVER_VERSION (v$SERVER_VERSION)"
            echo "Deleting invalid tag..."
            gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/$TAG_VERSION
            exit 1
          fi
          echo "Version validation passed: $TAG_VERSION matches v$SERVER_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            --notes-start-tag "" \
            --notes "See our [Roadmap & Changelog](https://stdapi.ai/roadmap/) for more details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
