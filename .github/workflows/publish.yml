name: Publish version

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-community
  # Local-only tag the image carries while it is tested, before it is pushed.
  CANDIDATE_IMAGE: stdapi-community:candidate

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Expansions reach the shell through `env:`: a tag name may hold `"`, `$`
      # or `;`, which spliced into `run:` would run as code.
      - name: Validate version matches tag
        run: |
          SERVER_VERSION=$(grep -oP 'SERVER_VERSION = "\K[^"]+' stdapi/server.py)
          if [ "$TAG_VERSION" != "v$SERVER_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match SERVER_VERSION (v$SERVER_VERSION)"
            echo "Deleting invalid tag..."
            gh api -X DELETE "/repos/$REPOSITORY/git/refs/tags/$TAG_VERSION"
            exit 1
          fi
          echo "Version validation passed: $TAG_VERSION matches v$SERVER_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}

      - name: Check if prerelease
        id: check
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          # Remove 'v' prefix for semver checking
          VERSION="${TAG_VERSION#v}"
          # Check if version contains prerelease identifiers (-, alpha, beta, rc, etc.)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "This is a stable release: $VERSION"
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "This is a prerelease: $VERSION"
          fi

  build-and-push:
    # No source-level check runs here: Lint and Test already ran on this commit
    # before it was tagged, and a tag is only applied to a green pipeline. What
    # this job does check is the artifact, which nothing else has seen.
    needs: validate-version
    environment: github-container-registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.validate-version.outputs.is_prerelease == 'false' }}

      # Loaded into the local engine instead of pushed: the image is tested
      # before it reaches the registry, and the tags below are applied to the
      # exact image that passed.
      - name: Build the candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv sync --frozen --group test

      # Samples in formats the image must accept are produced with the host's
      # ffmpeg; without it those tests skip instead of covering anything.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      # A missing codec, an unreadable file or a broken probe only shows up when
      # the image is run, which is here. The boot test skips itself: this job
      # holds no AWS credentials.
      - name: Test the candidate image
        env:
          CONTAINER_ENGINE: docker
          STDAPI_CONTAINER_IMAGE_COMMUNITY: ${{ env.CANDIDATE_IMAGE }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: pytest --container -m container

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CANDIDATE_IMAGE" "$tag"
            docker push "$tag"
          done

  publish:
    # Announced only once the image it refers to is built, tested and pushed.
    needs: [validate-version, build-and-push]
    runs-on: ubuntu-latest
    environment: github-releases
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            echo "Creating prerelease for $TAG_NAME"
          else
            echo "Creating stable release for $TAG_NAME"
          fi

          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            --notes-start-tag "" \
            --notes "See our [Roadmap & Changelog](https://stdapi.ai/roadmap/) for more details." \
            $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate-version.outputs.is_prerelease }}
